[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "photocull"
version = "0.7.0"
description = "Local, inspectable photo technical-quality analysis"
requires-python = ">=3.11"
dependencies = ["Pillow>=11.0,<13", "numpy>=2.0,<3", "opencv-python-headless>=4.10,<5", "streamlit>=1.64,<2"]

[project.optional-dependencies]
embeddings = ["torch>=2.6,<3", "torchvision>=0.21,<1", "open-clip-torch>=3.0,<4", "truststore>=0.10,<1"]
events = ["scikit-learn>=1.6,<2"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "pip-audit>=2.8,<3"]

[project.scripts]
photocull = "photocull.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
